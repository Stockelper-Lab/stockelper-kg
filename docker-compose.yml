services:
  neo4j:
    image: neo4j:latest
    container_name: stockelper-neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      # NOTE: KG full rebuild (mass delete + re-load) can OOM with the default 4G heap.
      # Tune these values based on dataset size and host RAM.
      - NEO4J_server_memory_pagecache_size=16G
      - NEO4J_server_memory_heap_initial__size=8G
      - NEO4J_server_memory_heap_max__size=16G
    ports:
      - "21004:7474"   # HTTP
      - "21005:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_conf:/conf
      - neo4j_plugins:/plugins
    networks:
      - stockelper
    restart: always

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_conf:
  neo4j_plugins:

networks:
  stockelper:
    driver: bridge
    name: stockelper
    external: true
